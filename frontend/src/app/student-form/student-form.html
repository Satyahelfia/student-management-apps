<div class="mx-12">
    <h3 class="mx-7">{{id ? "Update Student" : "Create Student"}}</h3>

    <form (ngSubmit)="upsert()" #f="ngForm" novalidate class="mt-4 mx-9 space-y-4">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="w-full" id="name" name="name" placeholder="enter your name" [(ngModel)]="student.name">
        </div>
        <div class="form-group">
            <label for="average">Average</label>
            <input type="number" class="w-full" id="average" name="average" placeholder="enter your average" [(ngModel)]="student.average">
        </div>
        <div class="form-group">
            <label for="OutOfRange" class="text-red-900">
                {{isOutOfRange ? "Average must be between 0 and 10" : ""}}
            </label>
        </div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">{{id ? "Update" : "Submit"}}</button>
    </form>
</div>
