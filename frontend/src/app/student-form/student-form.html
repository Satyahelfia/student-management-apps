<div class="max-w-xl mx-auto">
    <div class="bg-white shadow-sm ring-1 ring-slate-200 rounded-xl p-8">
        <h2 class="mb-6">{{id ? "Update Student" : "Create Student"}}</h2>

        <form (ngSubmit)="upsert()" #f="ngForm" novalidate class="space-y-6">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter student's name" [(ngModel)]="student.name">
            </div>
            
            <div>
                <label for="average">Average</label>
                <input type="number" id="average" name="average" placeholder="Enter student's average" [(ngModel)]="student.average">
                <p *ngIf="isOutOfRange" class="mt-2 text-sm text-red-600">
                    Average must be between 0 and 10.
                </p>
            </div>
            
            <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                <a [routerLink]="['/']" class="rounded-md bg-white px-3.5 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition-colors duration-150 text-center inline-block">
                    Cancel
                </a>
                <button type="submit">{{id ? "Update Student" : "Save Student"}}</button>
            </div>
        </form>
    </div>
</div>
