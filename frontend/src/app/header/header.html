<div class="bg-white shadow-sm">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex">
        <a routerLink="/dashboard" class="flex-shrink-0 flex items-center">
          <img src="/myr.png" class="h-10 w-10 object-contain" alt="Logo" />
          <span class="ml-3 text-sm font-medium text-slate-500">Satya Helfi A. / 143529 / MDP SS Batch 15</span>
        </a>
      </div>

      <div class="flex items-center sm:hidden" *ngIf="authService.isLoggedIn()">
        <button id="menu-toggle"
          class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-slate-500 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 cursor-pointer"
          onclick="document.getElementById('menu').classList.toggle('hidden')">
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <div id="menu" class="hidden sm:ml-6 sm:flex sm:space-x-2" *ngIf="authService.isLoggedIn()">
        <a class="nav-link" [class.nav-active]="isActive('/dashboard')" routerLink="/dashboard">
          <i class="fa-solid fa-gauge-high nav-icon"></i>
          Dashboard
        </a>
        <a class="nav-link" [class.nav-active]="isActive('/students')" routerLink="/students" *ngIf="userRole !== 'STUDENT'">
          <i class="fa-solid fa-users nav-icon"></i>
          Students
        </a>
        <a class="nav-link" [class.nav-active]="isActive('/projects')" routerLink="/projects" *ngIf="userRole !== 'STUDENT'">
          <i class="fa-solid fa-diagram-project nav-icon"></i>
          Projects
        </a>
        <a class="nav-link" [class.nav-active]="isActive('/assignment')" routerLink="/assignment" *ngIf="userRole !== 'STUDENT'">
          <i class="fa-solid fa-clipboard-check nav-icon"></i>
          Assignment
        </a>
        <a class="nav-link" [class.nav-active]="isActive('/my-submissions')" routerLink="/my-submissions" *ngIf="userRole === 'STUDENT'">
          <i class="fa-solid fa-file-arrow-up nav-icon"></i>
          My Submissions
        </a>
        <div class="flex items-center ml-2 gap-2">
          <!-- Theme Toggle Button -->
          <button (click)="toggleTheme()" class="theme-toggle" [title]="isDarkMode ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
            <i class="fa-solid" [class.fa-sun]="!isDarkMode" [class.fa-moon]="isDarkMode"></i>
          </button>

          <button (click)="logout()" class="nav-logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>
</div>

<style>
/* ===== NAV LINKS ===== */
.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.85rem;
    margin: auto 0;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: #64748b;
    text-decoration: none;
    transition: all 0.2s ease;
    position: relative;
    border: 1.5px solid transparent;
}

.nav-icon {
    font-size: 0.75rem;
}

.nav-link:hover {
    color: #4f46e5;
    background: #eef2ff;
}

/* ===== ACTIVE STATE ===== */
.nav-active {
    color: #4f46e5 !important;
    background: linear-gradient(135deg, #eef2ff, #e0e7ff) !important;
    border-color: #c7d2fe !important;
    font-weight: 600 !important;
}

.nav-active .nav-icon {
    color: #6366f1;
}

/* ===== LOGOUT ===== */
.nav-logout {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.85rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: #64748b;
    background: transparent;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: none;
}

.nav-logout:hover {
    color: #dc2626;
    background: #fef2f2;
    border-color: #fecaca;
}

/* ===== THEME TOGGLE BUTTON ===== */
.theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 0.5rem;
    font-size: 0.95rem;
    color: #64748b;
    background: transparent;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
    box-shadow: none !important;
}

.theme-toggle:hover {
    color: #4f46e5;
    background: #eef2ff;
}

body.dark .theme-toggle {
    color: #94a3b8;
}

body.dark .theme-toggle:hover {
    color: #f59e0b;
    background: #334155;
}
</style>
