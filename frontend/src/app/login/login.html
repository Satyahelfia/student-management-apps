<div class="login-page">
    <div class="login-container">
        <!-- Left panel - Branding -->
        <div class="login-branding">
            <div class="branding-content">
                <div class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Student Management</h1>
                <p>Manage students, projects, and assignments all in one place.</p>
                <div class="brand-features">
                    <div class="feature-item">
                        <i class="fa-solid fa-users"></i>
                        <span>Student Tracking</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-diagram-project"></i>
                        <span>Project Management</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-clipboard-check"></i>
                        <span>Assignment System</span>
                    </div>
                </div>
            </div>
            <div class="branding-decoration">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
            </div>
        </div>

        <!-- Right panel - Login Form -->
        <div class="login-form-panel">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Please sign in to your account</p>
                </div>

                <form (ngSubmit)="onSubmit()" class="login-form">
                    <div *ngIf="errorMessage" class="error-alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ errorMessage }}</span>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="username" name="username"
                                   [(ngModel)]="username" required
                                   placeholder="Enter your username"
                                   autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input [type]="showPassword ? 'text' : 'password'"
                                   id="password" name="password"
                                   [(ngModel)]="password" required
                                   placeholder="Enter your password"
                                   autocomplete="current-password">
                            <button type="button" class="toggle-password" (click)="togglePassword()">
                                <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
                            <span class="checkmark"></span>
                            <span class="remember-label">Remember me</span>
                        </label>
                        <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login" [disabled]="isLoading">
                        <span *ngIf="!isLoading">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Sign In
                        </span>
                        <span *ngIf="isLoading" class="loading-spinner">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Signing in...
                        </span>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a routerLink="/register" class="register-link">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    padding: 1rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.login-container {
    display: flex;
    width: 100%;
    max-width: 960px;
    min-height: 580px;
    border-radius: 1.25rem;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05);
}

/* ===== BRANDING PANEL ===== */
.login-branding {
    flex: 1;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.branding-content {
    position: relative;
    z-index: 2;
}

.brand-icon {
    width: 64px;
    height: 64px;
    border-radius: 1rem;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 1.75rem;
    color: white;
}

.login-branding h1 {
    color: white;
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    letter-spacing: -0.025em;
}

.login-branding p {
    color: rgba(255,255,255,0.8);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
}

.brand-features {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    color: rgba(255,255,255,0.9);
    font-size: 0.9rem;
    font-weight: 500;
}

.feature-item i {
    width: 36px;
    height: 36px;
    border-radius: 0.5rem;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
}

.branding-decoration {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
}

.circle-1 {
    width: 300px;
    height: 300px;
    top: -100px;
    right: -80px;
    animation: float 6s ease-in-out infinite;
}

.circle-2 {
    width: 200px;
    height: 200px;
    bottom: -50px;
    left: -60px;
    animation: float 8s ease-in-out infinite reverse;
}

.circle-3 {
    width: 120px;
    height: 120px;
    bottom: 30%;
    right: 10%;
    animation: float 7s ease-in-out infinite 1s;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
}

/* ===== FORM PANEL ===== */
.login-form-panel {
    flex: 1;
    background: #ffffff;
    padding: 3rem 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

.form-wrapper {
    width: 100%;
    max-width: 360px;
}

.form-header {
    margin-bottom: 2rem;
}

.form-header h2 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 0.4rem;
    letter-spacing: -0.025em;
}

.form-header p {
    color: #64748b;
    font-size: 0.9rem;
}

/* ===== ERROR ALERT ===== */
.error-alert {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 1rem;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 0.625rem;
    color: #dc2626;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
    animation: shake 0.4s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

/* ===== FORM GROUPS ===== */
.login-form .form-group {
    margin-bottom: 1.25rem;
}

.login-form .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 0.875rem;
    color: #94a3b8;
    font-size: 0.9rem;
    pointer-events: none;
    transition: color 0.2s;
    z-index: 1;
}

.input-wrapper input {
    width: 100%;
    padding: 0.7rem 0.875rem 0.7rem 2.6rem;
    border: 1.5px solid #e2e8f0;
    border-radius: 0.625rem;
    font-size: 0.9rem;
    color: #0f172a;
    background: #f8fafc;
    transition: all 0.2s ease;
    outline: none;
    box-shadow: none;
    ring: none;
}

.input-wrapper input:focus {
    border-color: #6366f1;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.input-wrapper input:focus + .input-icon,
.input-wrapper input:focus ~ .input-icon {
    color: #6366f1;
}

.input-wrapper input::placeholder {
    color: #94a3b8;
    font-weight: 400;
}

.toggle-password {
    position: absolute;
    right: 0.625rem;
    background: none !important;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 0.35rem;
    border-radius: 0.375rem;
    transition: color 0.2s;
    font-size: 0.85rem;
    box-shadow: none !important;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-password:hover {
    color: #6366f1;
    background: rgba(99, 102, 241, 0.06) !important;
}

/* ===== FORM OPTIONS ===== */
.form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: #475569;
    position: relative;
    padding-left: 1.75rem;
    user-select: none;
    margin-bottom: 0;
}

.remember-me input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    cursor: pointer;
}

.checkmark {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border: 1.5px solid #cbd5e1;
    border-radius: 0.25rem;
    background: #f8fafc;
    transition: all 0.2s;
}

.remember-me input:checked ~ .checkmark {
    background: #6366f1;
    border-color: #6366f1;
}

.remember-me input:checked ~ .checkmark::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 5px;
    height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.remember-label {
    font-weight: 500;
}

.forgot-link {
    font-size: 0.85rem;
    color: #6366f1;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
}

.forgot-link:hover {
    color: #4f46e5;
    text-decoration: underline;
}

/* ===== LOGIN BUTTON ===== */
.btn-login {
    width: 100%;
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white;
    border: none;
    border-radius: 0.625rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
}

.btn-login:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
}

.btn-login:active:not(:disabled) {
    transform: translateY(0);
}

.btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.loading-spinner {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

/* ===== FORM FOOTER ===== */
.form-footer {
    text-align: center;
    margin-top: 1.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid #f1f5f9;
}

.form-footer p {
    font-size: 0.875rem;
    color: #64748b;
}

.register-link {
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.register-link:hover {
    color: #4f46e5;
    text-decoration: underline;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .login-container {
        flex-direction: column;
        max-width: 440px;
    }

    .login-branding {
        padding: 2rem 2rem 1.5rem;
    }

    .login-branding h1 {
        font-size: 1.35rem;
    }

    .brand-features {
        display: none;
    }

    .login-form-panel {
        padding: 2rem;
    }
}
</style>
