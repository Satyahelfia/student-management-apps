<div *ngIf="student">
    <div class="sm:flex sm:items-center mb-6">
        <div class="sm:flex-auto">
            <h2 class="!mb-0">{{student.name}}'s Projects</h2>
            <p class="mt-2 text-sm text-slate-700">Manage the projects assigned to this student.</p>
        </div>
    </div>

    <div class="shadow-sm ring-1 ring-slate-200 rounded-lg overflow-hidden bg-white mb-8">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th class="relative px-6 py-3"><span class="sr-only">Remove</span></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let project of student.projects">
                    <td>{{project.id}}</td>
                    <td class="font-medium text-slate-900">{{project.name}}</td>
                    <td class="text-right text-sm font-medium">
                        <button class="interactivehover text-red-600 hover:text-red-900 bg-transparent border-0 p-0 shadow-none focus-visible:outline-none" (click)="deleteProject(project.id)">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="student.projects.length === 0">
                    <td colspan="3" class="text-center text-slate-500 py-8">No projects assigned yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="availableProjects.length > 0" class="bg-white shadow-sm ring-1 ring-slate-200 rounded-lg p-6 max-w-lg">
        <h3 class="text-lg font-medium leading-6 text-slate-900 mb-4">Assign a Project</h3>
        <form (ngSubmit)="addProject()" class="flex flex-col gap-4">
            <div>
                <label for="project" class="sr-only">Choose a Project</label>
                <select name="project" id="project" [(ngModel)]="projectId">
                    <option disabled selected value="">Choose a Project</option>
                    <option *ngFor="let project of availableProjects" [value]="project.id">{{project.name}}</option>
                </select>
            </div>
            <div>
                <button type="submit" class="w-full">Add Project</button>
            </div>
        </form>
    </div>
</div>
