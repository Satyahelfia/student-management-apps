<div class="login-page">
    <div class="forgot-container">
        <!-- Success State -->
        <div *ngIf="isSubmitted" class="success-state">
            <div class="success-icon">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h2>Check Your Inbox</h2>
            <p>We've sent a password reset link to your account associated with <strong>{{ email }}</strong>.</p>
            <p class="sub-text">Didn't receive it? Check your spam folder or try again.</p>
            <div class="success-actions">
                <button class="btn-primary" (click)="resetForm()">
                    <i class="fa-solid fa-rotate-left"></i>
                    Try Again
                </button>
                <a routerLink="/login" class="btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Sign In
                </a>
            </div>
        </div>

        <!-- Form State -->
        <div *ngIf="!isSubmitted" class="form-state">
            <div class="form-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <div class="form-header">
                <h2>Forgot Password?</h2>
                <p>No worries! Enter your username or email and we'll send you a reset link.</p>
            </div>

            <form (ngSubmit)="onSubmit()" class="forgot-form">
                <div *ngIf="errorMessage" class="error-alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>{{ errorMessage }}</span>
                </div>

                <div class="form-group">
                    <label for="email">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="text" id="email" name="email"
                               [(ngModel)]="email" required
                               placeholder="Enter your username or email"
                               autocomplete="username">
                    </div>
                </div>

                <button type="submit" class="btn-primary" [disabled]="isLoading">
                    <span *ngIf="!isLoading">
                        <i class="fa-solid fa-paper-plane"></i>
                        Send Reset Link
                    </span>
                    <span *ngIf="isLoading" class="loading-spinner">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Sending...
                    </span>
                </button>
            </form>

            <div class="form-footer">
                <a routerLink="/login" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    padding: 1rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.forgot-container {
    width: 100%;
    max-width: 460px;
    background: white;
    border-radius: 1.25rem;
    padding: 3rem 2.5rem;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05);
}

/* ===== FORM STATE ===== */
.form-icon {
    width: 64px; height: 64px;
    border-radius: 1rem;
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 1.5rem; color: #6366f1;
}

.form-header { text-align: center; margin-bottom: 2rem; }

.form-header h2 {
    font-size: 1.5rem; font-weight: 700; color: #0f172a;
    margin-bottom: 0.5rem; letter-spacing: -0.025em;
}

.form-header p {
    color: #64748b; font-size: 0.9rem; line-height: 1.5;
}

.error-alert {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.75rem 1rem; background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 0.625rem; color: #dc2626; font-size: 0.85rem;
    margin-bottom: 1.25rem; animation: shake 0.4s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

.forgot-form .form-group { margin-bottom: 1.5rem; }

.forgot-form .form-group label {
    display: block; font-size: 0.8rem; font-weight: 600; color: #334155;
    margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em;
}

.input-wrapper { position: relative; display: flex; align-items: center; }

.input-icon {
    position: absolute; left: 0.875rem; color: #94a3b8; font-size: 0.9rem;
    pointer-events: none; transition: color 0.2s; z-index: 1;
}

.input-wrapper input {
    width: 100%; padding: 0.75rem 0.875rem 0.75rem 2.6rem;
    border: 1.5px solid #e2e8f0; border-radius: 0.625rem;
    font-size: 0.9rem; color: #0f172a; background: #f8fafc;
    transition: all 0.2s ease; outline: none; box-shadow: none;
}

.input-wrapper input:focus {
    border-color: #6366f1; background: #ffffff;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.input-wrapper input::placeholder { color: #94a3b8; font-weight: 400; }

.btn-primary {
    width: 100%; padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white; border: none; border-radius: 0.625rem;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: all 0.3s ease;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    text-decoration: none;
}

.btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
}

.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

.loading-spinner { display: flex; align-items: center; gap: 0.5rem; }

.form-footer {
    text-align: center; margin-top: 2rem;
    padding-top: 1.5rem; border-top: 1px solid #f1f5f9;
}

.back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.875rem; color: #6366f1; text-decoration: none;
    font-weight: 600; transition: color 0.2s;
}

.back-link:hover { color: #4f46e5; }

/* ===== SUCCESS STATE ===== */
.success-state { text-align: center; }

.success-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 2rem; color: #059669;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.success-state h2 {
    font-size: 1.5rem; font-weight: 700; color: #0f172a;
    margin-bottom: 0.75rem;
}

.success-state p {
    color: #475569; font-size: 0.9rem; line-height: 1.6; margin-bottom: 0.25rem;
}

.sub-text {
    color: #94a3b8 !important; font-size: 0.825rem !important;
    margin-bottom: 1.5rem !important;
}

.success-actions {
    display: flex; flex-direction: column; gap: 0.75rem;
    margin-top: 1.5rem;
}

.btn-secondary {
    width: 100%; padding: 0.75rem 1.5rem;
    background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;
    border-radius: 0.625rem; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    text-decoration: none;
}

.btn-secondary:hover {
    background: #e2e8f0; color: #334155;
}

@media (max-width: 480px) {
    .forgot-container { padding: 2rem 1.5rem; }
}
</style>
